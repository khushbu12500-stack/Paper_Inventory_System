<!DOCTYPE html>
<html>
<head>
    <title>Update Stock</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="login-box">

    <h2>Update Stock</h2>

    <form method="POST">

        <label>Product Name</label><br>
        <input type="text"
               value="{{ product[1] }}"
               readonly><br><br>

        <label>Current Stock</label><br>
        <input type="number"
               value="{{ product[3] }}"
               readonly><br><br>

        <label>Stock In</label><br>
        <input type="number"
               name="stock_in"
               placeholder="Enter quantity received"
               min="1"
               required><br><br>

        <button type="submit">
            Update Stock
        </button>

    </form>

</div>

</body>
</html>
