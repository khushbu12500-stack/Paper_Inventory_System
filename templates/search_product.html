<!DOCTYPE html>
<html>
<head>
    <title>Search Product</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="login-box">

    <h2>Search Product</h2>

    <form method="POST">

        <label>Search Product</label><br>

        <input type="text"
               name="keyword"
               placeholder="Enter product name, category, supplier..."
               required>

        <br><br>

        <button type="submit">Search</button>

    </form>

    <br>

    {% if products %}

    <table border="1" width="100%">
        <tr>
            <th>ID</th>
            <th>Product Name</th>
            <th>Category</th>
            <th>Quantity</th>
            <th>Supplier</th>
        </tr>

        {% for product in products %}

        <tr>
            <td>{{ product[0] }}</td>
            <td>{{ product[1] }}</td>
            <td>{{ product[2] }}</td>
            <td>{{ product[3] }}</td>
            <td>{{ product[8] }}</td>
        </tr>

        {% endfor %}

    </table>

    {% endif %}

</div>

</body>
</html>
