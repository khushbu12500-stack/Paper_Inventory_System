<!DOCTYPE html>
<html>
<head>
    <title>Stock Out</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="login-box">

    <h2>Stock Out</h2>

    <form method="POST">

        <label>Product Name</label><br>
        <input type="text" value="{{ product[1] }}" readonly><br><br>

        <label>Current Stock</label><br>
        <input type="number" value="{{ product[3] }}" readonly><br><br>

        <label>Stock Out Quantity</label><br>
        <input type="number"
               name="stock_out"
               min="1"
               placeholder="Enter quantity to remove"
               required><br><br>

        <button type="submit">Update Stock</button>

    </form>

</div>

</body>
</html>
